name: Docker Build & Push to GHCR

on:
  push:
    branches:
      - pablo_reyes

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: 🧾 Checkout repository
      uses: actions/checkout@v4

    # Paso: crear la versión en minúsculas del repo (owner/repo)
    - id: repo_lower
      name: 🔎 Prepare lowercased repo name
      run: |
        # GITHUB_REPOSITORY contiene "owner/repo"
        REPO="$GITHUB_REPOSITORY"
        LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
        echo "repo_lower=$LOWER" >> "$GITHUB_OUTPUT"

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ steps.repo_lower.outputs.repo_lower }}:pablo-v-1.0.1
